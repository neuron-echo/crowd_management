dataset:
  name: HAJJv2
  root: video samples

ingestion:
  target_fps: 5
  real_time_mode: true
  buffer_size: 30
  drop_policy: oldest

models:
  device: auto
  csrnet:
    enabled: true
    checkpoint_path: checkpoints/PartAmodel_best.pth
    inference_resolution: [720, 540]
  bytetrack:
    enabled: true
    model_path: yolov8l.pt
    tracker_config: bytetrack.yaml
    confidence_threshold: 0.3
    motion_threshold_px: 2.0

cameras:
  - camera_id: cam_01
    name: Video Sample 2
    source_type: video
    source: video samples/2.mp4
    enabled: true

  - camera_id: cam_02
    name: Video Sample 5
    source_type: video
    source: video samples/5.mp4
    enabled: true